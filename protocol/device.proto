syntax = "proto3";
package info_tv.v1;

// Version 1 supports bounded status cards and independent notifications.
message Envelope {
  uint32 protocol_version = 1;
  string session_id = 2;
  string message_id = 3;
  oneof body {
    Hello hello = 10;
    Snapshot snapshot = 11;
    CardUpsert card_upsert = 12;
    Notification notification = 13;
    Acknowledgment acknowledgment = 14;
    Error error = 15;
    Ping ping = 16;
    Pong pong = 17;
    DeviceSettings device_settings = 18;
    Weather weather = 19;
    WeatherAlert weather_alert = 20;
    PowerSettings power_settings = 21;
  }
}

// Host sends an empty Hello; the device replies with its nonzero boot identity.
message Hello {
  uint64 boot_id = 1;
  // Zero identifies older firmware without multi-conversation overview support.
  uint32 max_cards = 2;
  // Required by hosts that send task-purpose icons.
  bool task_icons = 3;
  bool brightness_control = 4;
  bool weather = 5;
  bool weather_details = 6;
  bool power_control = 7;
  bool unlock_polling = 8;
}
message Ping {}
message Pong {}

// Absolute device settings; presence distinguishes off (0) from missing input.
message DeviceSettings {
  optional uint32 brightness_percent = 1;
}

// Absolute host lock policy. Touch-wake preview timing belongs to the device.
enum LockAction {
  LOCK_ACTION_NONE = 0;
  LOCK_ACTION_SCREEN_OFF = 1;
  LOCK_ACTION_DEEP_SLEEP = 2;
}
message PowerSettings {
  LockAction lock_action = 1;
  bool session_locked = 2;
  // Zero disables timer wake. Otherwise sleep this many seconds between silent probes.
  uint32 unlock_poll_seconds = 3;
}

enum Tone {
  TONE_UNSPECIFIED = 0;
  TONE_NEUTRAL = 1;
  TONE_ATTENTION = 2;
  TONE_POSITIVE = 3;
  TONE_NEGATIVE = 4;
}
message StatusView {
  string text = 1;
  Tone tone = 2;
  string detail = 3;
  optional uint32 progress_percent = 4;
  // Remaining lifetime of a recent-question hint; zero hides it without changing state.
  uint32 recent_question_seconds = 5;
}
enum TaskIcon {
  TASK_ICON_TASK = 0;
  TASK_ICON_CODE = 1;
  TASK_ICON_TEST = 2;
  TASK_ICON_BUILD = 3;
  TASK_ICON_REVIEW = 4;
  TASK_ICON_DEPLOY = 5;
}
message View {
  string title = 1;
  string source = 2;
  string context = 3;
  TaskIcon icon = 4;
  oneof content { StatusView status = 10; }
}
message Card {
  string card_id = 1;
  uint64 revision = 2;
  View view = 3;
}
// A zero-validity empty message clears weather. Other updates require all data.
enum WeatherCondition {
  WEATHER_CONDITION_UNKNOWN = 0;
  WEATHER_CONDITION_CLEAR = 1;
  WEATHER_CONDITION_CLOUDY = 2;
  WEATHER_CONDITION_RAIN = 3;
  WEATHER_CONDITION_SNOW = 4;
  WEATHER_CONDITION_STORM = 5;
  WEATHER_CONDITION_FOG = 6;
}
message Weather {
  string location = 1;
  optional sint32 temperature_c = 2;
  WeatherCondition condition = 3;
  // Remaining freshness at transmission; retries may only shorten it.
  uint32 valid_for_ms = 4;
  optional sint32 daily_low_c = 5;
  optional sint32 daily_high_c = 6;
}
enum WeatherAlertSeverity {
  WEATHER_ALERT_SEVERITY_UNSPECIFIED = 0;
  WEATHER_ALERT_SEVERITY_BLUE = 1;
  WEATHER_ALERT_SEVERITY_YELLOW = 2;
  WEATHER_ALERT_SEVERITY_ORANGE = 3;
  WEATHER_ALERT_SEVERITY_RED = 4;
}
// One producer-selected alert, synchronized separately to bound snapshot size.
// A fully empty message clears it. Retries never extend the original lifetime.
message WeatherAlert {
  string alert_id = 1;
  string title = 2;
  string source = 3;
  string location = 4;
  WeatherAlertSeverity severity = 5;
  string detail = 6;
  uint32 valid_for_ms = 7;
  bool notify = 8;
}
message Snapshot {
  repeated Card cards = 1;
  Weather weather = 2;
}
message CardUpsert { Card card = 1; }

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_ORDINARY = 1;
  PRIORITY_IMPORTANT = 2;
}
message Notification {
  string notification_id = 1;
  Priority priority = 2;
  optional uint32 display_duration_ms = 3;
  // Remaining admission/start validity at transmission. Retrying may only shorten it.
  uint32 valid_for_ms = 4;
  View view = 5;
  // Related persistent card to reveal when the notification finishes.
  string card_id = 6;
}
enum AckStage {
  ACK_STAGE_UNSPECIFIED = 0;
  ACK_STAGE_ACCEPTED = 1;
  ACK_STAGE_PRESENTED = 2;
  // Hardware accepted the setting; this is independent of LCD presentation.
  ACK_STAGE_APPLIED = 3;
}
message Acknowledgment {
  string in_reply_to = 1;
  AckStage stage = 2;
  // Presented identifies one actually visible card within a snapshot.
  string card_id = 3;
  uint64 revision = 4;
  optional uint32 brightness_percent = 5;
  optional LockAction lock_action = 6;
  optional bool session_locked = 7;
  optional uint32 unlock_poll_seconds = 8;
}
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID = 1;
  ERROR_CODE_BUSY = 2;
  ERROR_CODE_UNSUPPORTED = 3;
  ERROR_CODE_EXPIRED = 4;
  ERROR_CODE_HARDWARE = 5;
}
message Error {
  string in_reply_to = 1;
  ErrorCode code = 2;
  string detail = 3;
}
