[project]
name = "info-tv-service"
version = "0.1.0"
description = "Local structured-display service for info_tv"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "protobuf>=6.31,<7", "pyserial==3.5"]

[project.scripts]
info-tv = "info_tv_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ty", "grpcio-tools>=1.73,<1.78", "nanopb==0.4.9.1", "types-protobuf", "types-pyserial"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
exclude = ["src/info_tv_service/device/generated/device_pb2.py"]
