[project]
name = "info-tv-service"
dynamic = ["version"]
description = "Local structured-display service for info_tv"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "protobuf>=6.31,<7",
    "pyserial>=3.5",
    "httpx[socks]>=0.28",
    "pyyaml>=6"
]

[project.scripts]
info-tv = "info_tv_service.__main__:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/info_tv_service"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = { search_parent_directories = true, local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "src/info_tv_service/_version.py"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "ty",
    "grpcio-tools>=1.73,<1.78",
    "nanopb==0.4.9.1",
    "types-protobuf",
    "types-pyserial",
    "types-pyyaml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not hardware"]
markers = [
    "hardware: requires a physical device and explicit hardware test selection",
    "integration: exercises multiple components, including the native firmware bridge",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [
    "src/info_tv_service/device/generated",
    "src/info_tv_service/_version.py"
    ]
force-exclude = true

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [
    "src/info_tv_service/device/generated",
    "src/info_tv_service/_version.py"
]
