# Field reference: ../docs/host-configuration.md
# Select the single matching USB device, or specify a port such as COM6.
serial_port: auto
# USB VID/PID for automatic selection; YAML hexadecimal integers, without quotes.
usb_vid: 0x303A
usb_pid: 0x1001
http_port: 8765
completed_retention_seconds: 300

# Omit weather (or set it to null) to disable automatic network requests.
# Shanghai city center; English label fits the current device font.
# Weather data: Open-Meteo (https://open-meteo.com/), CC BY 4.0.
weather:
  location: Shanghai
  latitude: 31.2304
  longitude: 121.4737
  refresh_seconds: 900
  retry_seconds: 60
  valid_for_seconds: 1800
