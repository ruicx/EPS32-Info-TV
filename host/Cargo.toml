[package]
name = "info-tv"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local structured-display service for info_tv"
build = "build.rs"
default-run = "info-tv"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks", "blocking"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync", "signal", "process", "test-util"] }
tokio-serial = { version = "5", default-features = false }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
unicode-general-category = "1"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
