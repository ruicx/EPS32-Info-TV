# Rust host configuration. Copy to info-tv.yaml for working-directory discovery.
serial_port: auto
usb_vid: 0x303A
usb_pid: 0x1001
http_port: 8765
completed_retention_seconds: 300

# Windows only: none, screen_off, or deep_sleep (touch wake, 15-second locked preview).
lock_action: none
# Deep sleep only: seconds asleep between silent unlock checks (0 disables; 1..3600).
unlock_poll_seconds: 0

# Uncomment to enable automatic weather. The location is an explicit example.
# weather:
#   location: Shanghai
#   latitude: 31.2304
#   longitude: 121.4737
#   refresh_seconds: 900
#   retry_seconds: 60
#   valid_for_seconds: 1800
